<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Movies</title>
<style>
  :root{--bg:#0f1220;--card:#1a1f35;--ink:#e7e9f3;--muted:#9aa3c7;--accent:#6c8cff;--line:#2a3050;--ok:#3ddc97;--bad:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.5 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
  header{display:flex;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--line)}
  h1{font-size:20px;margin:0;flex:1}
  #status{font:13px ui-monospace,monospace;color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
  #status b{color:var(--ok)} #status.err b{color:var(--bad)}
  main{max-width:900px;margin:0 auto;padding:24px;display:grid;gap:18px}
  input{font:inherit;background:#0c0f1c;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 12px}
  button{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  form{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  form input[name=title],form input[name=director]{flex:1;min-width:140px}
  form input[name=year]{width:100px}
  .chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
  .err-text{color:var(--bad);font-size:14px;margin:0;width:100%;min-height:1px}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .card h3{margin:0 0 4px;font-size:16px}
  .meta{color:var(--muted);font-size:14px}
  .badge{display:inline-block;margin:10px 0;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .badge.seen{color:var(--ok);border-color:var(--ok)}
  .card .row{display:flex;gap:8px}
  .card .row button{flex:1;background:transparent;color:var(--muted);border:1px solid var(--line);padding:6px}
  .card .row button.del{color:var(--bad)}
</style>
</head>
<body>
  <header><h1>🎬 My Movies</h1><span id="status">ready</span></header>
  <main>
    <form id="form" novalidate>
      <input name="title" placeholder="Title">
      <input name="director" placeholder="Director">
      <input name="year" type="number" placeholder="Year">
      <label class="chk"><input type="checkbox" name="watched"> watched</label>
      <button type="submit" id="submitBtn">Add movie</button>
      <button type="button" id="cancelBtn" class="ghost" hidden onclick="resetForm()">Cancel</button>
      <p id="formErr" class="err-text"></p>
    </form>
    <div id="list" class="grid"></div>
  </main>
<script>
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const show = (m, p, status, ok) => { const s = $("#status"); s.className = ok ? "" : "err"; s.innerHTML = `${m} ${p} → <b>${status}</b>`; };

  let MOVIES = [], editing = null;

  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: body ? {"Content-Type": "application/json"} : {},
      body: body ? JSON.stringify(body) : undefined
    });
    const data = await res.json().catch(() => null);   // 204 has no body
    show(method, path, res.status, res.ok);
    return { status: res.status, data };
  }

  const card = m => `<div class="card">
    <h3>${esc(m.title)}</h3>
    <div class="meta">${esc(m.director)} · ${m.year}</div>
    <span class="badge ${m.watched ? "seen" : ""}">${m.watched ? "watched" : "unwatched"}</span>
    <div class="row">
      <button onclick="startEdit(${m.id})">Edit</button>
      <button class="del" onclick="del(${m.id})">Delete</button>
    </div>
  </div>`;

  async function load() {
    const { data } = await api("GET", "/movies");
    MOVIES = data || [];
    $("#list").innerHTML = MOVIES.length ? MOVIES.map(card).join("") : '<p class="meta">No movies yet.</p>';
  }

  async function del(id) {
    const { status } = await api("DELETE", `/movies/${id}`);
    if (status === 204 || status === 200) { if (editing === id) resetForm(); load(); }
  }

  function startEdit(id) {
    const m = MOVIES.find(x => x.id === id);
    if (!m) return;
    const f = $("#form");
    f.title.value = m.title; f.director.value = m.director; f.year.value = m.year; f.watched.checked = m.watched;
    editing = id;
    $("#submitBtn").textContent = "Save changes";
    $("#cancelBtn").hidden = false;
    $("#formErr").textContent = "";
  }

  function resetForm() {
    $("#form").reset();
    editing = null;
    $("#submitBtn").textContent = "Add movie";
    $("#cancelBtn").hidden = true;
    $("#formErr").textContent = "";
  }

  $("#form").addEventListener("submit", async e => {
    e.preventDefault();
    const f = e.target;
    $("#formErr").textContent = "";
    const body = { title: f.title.value, director: f.director.value, year: Number(f.year.value), watched: f.watched.checked };
    const method = editing ? "PUT" : "POST";
    const path = editing ? `/movies/${editing}` : "/movies";
    const { status, data } = await api(method, path, body);
    if (status === 400) { $("#formErr").textContent = data?.message || data?.error || "Invalid input."; return; }
    if (status === 200 || status === 201) { resetForm(); load(); }
  });

  load();
</script>
</body>
</html>
